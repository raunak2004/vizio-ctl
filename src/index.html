<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundbar Remote</title>
<style>
  :root {
    --bg: #f4f4f6; --card: #ffffff; --text: #1b1b1f; --muted: #6b6b76; --line: #e3e3ea;
    --btn: #e8e8ee; --btn-hover: #dcdce6; --accent: #2f6df6; --on: #1f9d55; --off: #8a8a96; --err: #c93a3a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141418; --card: #1e1e24; --text: #f0f0f4; --muted: #9a9aa6; --line: #2e2e38;
      --btn: #2a2a33; --btn-hover: #34343f; --accent: #5b8cff; --on: #3ecf7a; --off: #70707c; --err: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: start center;
    background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; padding: 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; display: grid; gap: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.on { background: var(--on); }
  .dot.err { background: var(--err); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button {
    border: 0; border-radius: 14px; padding: 18px 0; font: inherit; font-weight: 600;
    color: var(--text); background: var(--btn); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .5; cursor: progress; }
  button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #fff; }
  button.small { padding: 8px 14px; font-size: 14px; font-weight: 500; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
  .row.muted { color: var(--muted); }
  select { font: inherit; color: var(--text); background: var(--btn); border: 0; border-radius: 8px; padding: 6px 10px; max-width: 60%; }
  .msg { min-height: 1.4em; font-size: 13px; color: var(--err); }
  details { border-top: 1px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .group { display: grid; gap: 16px; margin-top: 16px; }
  .level label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .level output { color: var(--text); font-variant-numeric: tabular-nums; }
  .level input[type=range] { width: 100%; accent-color: var(--accent); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions button { padding: 12px 8px; font-size: 14px; font-weight: 500; }
  :disabled { opacity: .5; }

  dialog { border: 0; border-radius: 20px; padding: 0; width: min(440px, calc(100vw - 32px)); max-height: 85vh; background: var(--card); color: var(--text); box-shadow: 0 8px 40px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 24px; display: grid; gap: 16px; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-body { overflow: auto; max-height: 55vh; display: grid; gap: 18px; }
  .dlg h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  dd.hidden { color: var(--muted); font-style: italic; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="top">
      <h1>Soundbar Remote</h1>
      <button id="info-btn" class="small" type="button">Info</button>
    </div>
    <div class="status"><span id="dot" class="dot"></span><span id="state">Checking…</span></div>

    <div class="pair">
      <button class="primary" data-act="on">On</button>
      <button data-act="off">Off</button>
    </div>

    <div class="pair">
      <button data-act="vol-down">Vol −</button>
      <button data-act="vol-up">Vol +</button>
    </div>

    <button data-act="mute">Mute / Unmute</button>

    <label class="row muted">Volume steps per press
      <select id="steps">
        <option>1</option><option>2</option><option>3</option><option>5</option><option>10</option>
      </select>
    </label>

    <div id="groups" aria-busy="true"></div>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </div>
</main>

<dialog id="info-dlg" aria-labelledby="info-title">
  <div class="dlg">
    <div class="dlg-head">
      <h2 id="info-title">Soundbar information</h2>
      <button id="info-close" class="small" type="button">Close</button>
    </div>
    <label class="check"><input id="reveal" type="checkbox"> Show serial number, MAC addresses, SSID and IP</label>
    <div id="info-body" class="dlg-body">Loading…</div>
  </div>
</dialog>

<script>
  const $ = id => document.getElementById(id);
  const dot = $('dot'), stateEl = $('state'), msg = $('msg'), steps = $('steps'), groupsEl = $('groups');
  const staticButtons = document.querySelectorAll('button[data-act]');
  const controls = {};   // setting name -> { el, out }
  const actionButtons = [];
  let busy = false;

  const fmt = v => (typeof v === 'number' && v > 0 ? '+' + v : String(v));

  function setBusy(on) {
    busy = on;
    staticButtons.forEach(b => b.disabled = on);
    actionButtons.forEach(b => b.disabled = on);
    Object.values(controls).forEach(c => c.el.disabled = on);
  }

  function show(data) {
    dot.className = 'dot ' + (data.power === 'on' ? 'on' : '');
    const parts = ['Power: ' + data.power];
    if (data.volume != null) parts.push('Vol ' + data.volume);
    if (data.mute) parts.push('muted');
    stateEl.textContent = parts.join(' · ');
    msg.textContent = '';
    for (const [name, c] of Object.entries(controls)) {
      const v = data.settings && data.settings[name];
      if (v == null) { if (c.out) c.out.textContent = '–'; continue; }
      // Don't move a control the user is holding.
      if (document.activeElement !== c.el) c.el.value = v;
      if (c.out) c.out.textContent = fmt(v);
    }
  }

  function showError(text) {
    dot.className = 'dot err';
    stateEl.textContent = 'Unreachable';
    msg.textContent = text;
  }

  async function call(path, method) {
    // The custom header lets the server reject requests from other websites.
    const res = await fetch(path, { method, headers: { 'X-Requested-With': 'soundbar-ui' } });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data;
  }

  async function run(path, method) {
    if (busy) return;
    setBusy(true);
    try { show(await call(path, method)); }
    catch (e) { showError(e.message); }
    finally { setBusy(false); }
  }

  function el(tag, props, ...kids) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...kids);
    return node;
  }

  function rangeControl(s) {
    const out = el('output', { textContent: '–' });
    const input = el('input', { id: 'set-' + s.name, type: 'range', step: 1, min: s.min, max: s.max, value: s.min });
    input.addEventListener('input', () => { out.textContent = fmt(Number(input.value)); });
    // Send on release rather than on every tick while dragging.
    input.addEventListener('change', () => run('/api/set/' + s.name + '?value=' + input.value, 'POST'));
    controls[s.name] = { el: input, out };
    return el('div', { className: 'level' }, el('label', { htmlFor: input.id }, s.label + ' ', out), input);
  }

  function choiceControl(s) {
    const select = el('select', {}, ...s.options.map(o => el('option', { value: o, textContent: o })));
    select.addEventListener('change', () => run('/api/set/' + s.name + '?value=' + encodeURIComponent(select.value), 'POST'));
    controls[s.name] = { el: select, out: null };
    return el('label', { className: 'row' }, el('span', { textContent: s.label }), select);
  }

  function actionControl(s) {
    const b = el('button', { type: 'button', textContent: s.label });
    b.addEventListener('click', () => {
      if (s.confirm && !window.confirm(s.label + '? This can interrupt the soundbar.')) return;
      run('/api/action/' + s.name, 'POST');
    });
    actionButtons.push(b);
    return b;
  }

  function buildControls(list) {
    groupsEl.textContent = '';
    const order = ['Sound', 'Input', 'System', 'Actions'];
    for (const g of order) {
      const items = list.filter(s => s.group === g);
      if (!items.length) continue;
      const body = el('div', { className: g === 'Actions' ? 'actions' : 'group' });
      for (const s of items) {
        body.appendChild(s.kind === 'range' ? rangeControl(s) : s.kind === 'choice' ? choiceControl(s) : actionControl(s));
      }
      const d = el('details', {}, el('summary', { textContent: g }), body);
      d.open = g === 'Sound' || g === 'Input';
      groupsEl.appendChild(d);
    }
    groupsEl.removeAttribute('aria-busy');
  }

  staticButtons.forEach(b => b.addEventListener('click', () => {
    const name = b.dataset.act;
    run('/api/' + name + (name.startsWith('vol-') ? '?steps=' + steps.value : ''), 'POST');
  }));

  try { steps.value = localStorage.getItem('steps') || '1'; } catch (e) {}
  steps.addEventListener('change', () => { try { localStorage.setItem('steps', steps.value); } catch (e) {} });

  // ----- Info popup -----
  const dlg = $('info-dlg'), body = $('info-body'), reveal = $('reveal');

  async function loadInfo() {
    body.textContent = 'Loading…';
    try {
      const data = await call('/api/info?reveal=' + (reveal.checked ? 1 : 0), 'GET');
      body.textContent = '';
      for (const sec of data.sections) {
        const dl = el('dl', {});
        for (const r of sec.rows) {
          dl.append(el('dt', { textContent: r.label }), el('dd', { textContent: r.value || '–', className: r.hidden ? 'hidden' : '' }));
        }
        body.append(el('section', {}, el('h3', { textContent: sec.title }), dl));
      }
      if (!data.sections.length) body.textContent = 'No information available. Is the soundbar on?';
    } catch (e) {
      body.textContent = e.message;
    }
  }

  $('info-btn').addEventListener('click', () => { reveal.checked = false; dlg.showModal(); loadInfo(); });
  $('info-close').addEventListener('click', () => dlg.close());
  reveal.addEventListener('change', loadInfo);
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

  async function refresh() {
    if (busy) return;
    try { show(await call('/api/status', 'GET')); }
    catch (e) { showError(e.message); }
  }

  (async () => {
    try { buildControls((await call('/api/schema', 'GET')).settings); }
    catch (e) { showError(e.message); }
    refresh();
    setInterval(refresh, 10000);
  })();
</script>
</body>
</html>
